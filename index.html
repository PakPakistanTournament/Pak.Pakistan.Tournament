<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pak.Pakistan.Tournament - Auth</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="auth-container">
    <!-- STEP 1: LOGIN -->
    <div class="auth-box login-box">
      <h2>LOGIN</h2>
      <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="input-group">
          <label>Step 1: Email or Username</label>
          <input type="text" placeholder="Enter Email or Username" required>
        </div>
        <div class="input-group">
          <label>Step 2: Password</label>
          <input type="password" placeholder="Enter Password" required>
        </div>
        <div class="forgot-pass">
          <a href="#">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-orange">Login</button>
      </form>
    </div>

    <!-- STEP 2: REGISTRATION -->
    <div class="auth-box register-box">
      <h2>REGISTRATION</h2>
      <form id="registerForm" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="input-group">
          <label>Free Fire UID</label>
          <input type="text" placeholder="e.g. 123456789" required>
        </div>
        <div class="input-group">
          <label>Free Fire In-Game Name</label>
          <input type="text" placeholder="e.g. OP_GAMER" required>
        </div>
        <div class="input-group">
          <label>Username</label>
          <input type="text" placeholder="App Username" required>
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" placeholder="Enter Email" required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" placeholder="Enter Password" required>
        </div>
        <div class="input-group">
          <label>Promo Code (Optional)</label>
          <input type="text" placeholder="Promo Code">
        </div>
        <div class="input-group">
          <label>Referral Code (Optional)</label>
          <input type="text" placeholder="Referral Code">
        </div>
        <button type="submit" class="btn btn-blue">Create Account</button>
      </form>
    </div>
  </div>

</body>
</html>
